*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px "Segoe UI",Calibri,Arial,sans-serif;color:var(--fg);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}

.tabs{background:var(--green);display:flex;gap:2px;padding:0 10px;overflow-x:auto}

.tabs span.on{background:var(--chrome);color:var(--green);border-radius:4px 4px 0 0;font-weight:600;opacity:1}
.ribbon{background:var(--chrome);border-bottom:1px solid var(--hdr-b);display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:8px 14px}
.group{display:flex;align-items:center;gap:6px}
.group label{font-size:12px;color:var(--muted)}
select,input[type=search]{font:inherit;border:1px solid #c6c6c6;border-radius:2px;padding:4px 6px;background:#fff}
input[type=search]{width:220px}
.btn{font:inherit;border:1px solid #c6c6c6;background:#fff;padding:4px 10px;border-radius:2px;cursor:pointer;color:var(--fg);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#e9f1ec;border-color:var(--green)}
.btn.primary{background:var(--green);color:#fff;border-color:var(--green-d)}

.fbar{display:flex;align-items:stretch;border-bottom:1px solid var(--hdr-b);background:#fff}
.fbar .ref{width:90px;border-right:1px solid var(--hdr-b);padding:5px 8px;font-size:12.5px}
.fbar .fx{padding:5px 10px;color:var(--muted);border-right:1px solid var(--hdr-b);font-style:italic}
.fbar .val{flex:1;padding:5px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sheet{flex:1;overflow:auto;position:relative;background:#fff}
table{border-collapse:separate;border-spacing:0;table-layout:fixed}
th,td{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:22px;max-width:0}
thead th{position:sticky;background:var(--hdr);font-weight:400;color:#444;border-color:var(--hdr-b);z-index:2}
thead tr.letters th{top:0;text-align:center;height:20px;font-size:11.5px}
thead tr.heads th{top:20px;background:var(--green);color:#fff;font-weight:600;text-align:left;cursor:pointer;user-select:none}
thead tr.heads th:hover{background:var(--green-d)}
th.rn,td.rn{position:sticky;left:0;background:var(--hdr);color:#444;text-align:center;width:46px;font-size:11.5px;border-color:var(--hdr-b);z-index:1}
thead th.rn{z-index:3}
thead tr.heads th.rn{background:var(--hdr);color:#444;cursor:default}
td{cursor:cell}
td.sel{outline:2px solid var(--sel);outline-offset:-2px;background:var(--selbg)}
tr:hover td:not(.rn){background:#f5f9f6}
td a{color:#0563c1}
.pA{background:#c6efce!important;color:#006100;text-align:center;font-weight:600}
.pB{background:#ffeb9c!important;color:#9c5700;text-align:center;font-weight:600}
.pC{background:#f2f2f2!important;color:#555;text-align:center}
.sumwrap{padding:18px}
.sumwrap table td,.sumwrap table th{max-width:none}
.sumwrap td:first-child{width:220px}
.sheettabs{display:flex;align-items:center;background:var(--chrome);border-top:1px solid var(--hdr-b);padding:0 10px;gap:2px;font-size:12.5px}
.sheettabs button{font:inherit;border:0;background:transparent;padding:6px 16px;cursor:pointer;color:#444}
.sheettabs button.on{background:#fff;color:var(--green);font-weight:600;border-bottom:3px solid var(--green)}
.status{margin-left:auto;color:var(--muted);padding:6px 4px;white-space:nowrap}
.toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:6px 14px;border-radius:3px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:600px){input[type=search]{width:150px}.tabs span:nth-child(n+4){display:none}}

const cols = D.cols, all = D.rows;
const $ = id => document.getElementById(id);
const letter = i => { let s=''; i++; while(i){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26);} return s; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let sortKey = null, sortDir = 1, view = all, tab = 'leads';
$('built').textContent = '· ' + all.length + ' companies · built ' + (D.summary.find(s=>s[0]==='Built')||['',''])[1];

const uniq = k => [...new Set(all.map(r=>r[k]).filter(Boolean))].sort();
uniq('tier').forEach(v => $('fType').add(new Option(v,v)));
uniq('state').forEach(v => $('fState').add(new Option(v,v)));

function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),1200); }
function copy(t, msg){
  const done = () => toast(msg||'Copied');
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, () => fallback(t, done)); else fallback(t, done);
}
function fallback(t, done){ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); try{document.execCommand('copy'); done();}catch(e){} a.remove(); }

function filter(){
  const q = $('q').value.trim().toLowerCase(), t=$('fType').value, p=$('fPri').value, s=$('fState').value, h=$('fHas').value;
  view = all.filter(r =>
    (!t || r.tier===t) && (!p || r.priority===p) && (!s || r.state===s) &&
    (!h || (h==='rep'&&r.rep_name) || (h==='email'&&r.email) || (h==='pemail'&&r.email_type==='personal')) &&
    (!q || cols.some(([k]) => (r[k]||'').toLowerCase().includes(q))));
  if (sortKey) view = [...view].sort((a,b) => (a[sortKey]||'').localeCompare(b[sortKey]||'', undefined, {numeric:true}) * sortDir);
  render();
}

function cell(k, v){
  if (!v) return '';
  if (k==='website' || k==='source_url'){ const u = v.includes('://') ? v : 'https://'+v; return `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(v.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,''))}</a>`; }
  return esc(v);
}

function render(){
  if (tab==='summary'){ renderSummary(); return; }
  const tw = 46 + cols.reduce((a,c)=>a+c[2]*7.5,0);
  let h = '<table style="width:'+tw+'px"><colgroup><col style="width:46px">' + cols.map(c=>`<col style="width:${c[2]*7.5}px">`).join('') + '</colgroup><thead><tr class="letters"><th class="rn"></th>' +
    cols.map((_,i)=>`<th>${letter(i)}</th>`).join('') + '</tr><tr class="heads"><th class="rn">1</th>' +
    cols.map(([k,l])=>`<th data-k="${k}" title="Sort by ${esc(l)}">${esc(l)}${sortKey===k?(sortDir>0?' ▲':' ▼'):''}</th>`).join('') + '</tr></thead><tbody>';
  view.forEach((r,ri) => {
    h += `<tr><td class="rn">${ri+2}</td>` + cols.map(([k],ci) =>
      `<td data-r="${ri}" data-c="${ci}" class="${k==='priority'&&r[k]?'p'+r[k]:''}">${cell(k,r[k])}</td>`).join('') + '</tr>';
  });
  $('sheet').innerHTML = h + '</tbody></table>';
  $('status').textContent = `${view.length} of ${all.length} rows`;
}

function renderSummary(){
  $('sheet').innerHTML = '<div class="sumwrap"><table><thead><tr class="heads"><th style="position:static">Metric</th><th style="position:static">Value</th></tr></thead><tbody>' +
    D.summary.map(([a,b])=>`<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join('') + '</tbody></table></div>';
  $('status').textContent = '';
}

$('sheet').addEventListener('click', e => {
  const th = e.target.closest('thead tr.heads th[data-k]');
  if (th){ const k=th.dataset.k; sortDir = sortKey===k ? -sortDir : 1; sortKey=k; filter(); return; }
  const td = e.target.closest('td[data-c]'); if (!td) return;
  document.querySelectorAll('td.sel').forEach(x=>x.classList.remove('sel')); td.classList.add('sel');
  const r = view[+td.dataset.r], k = cols[+td.dataset.c][0];
  $('ref').textContent = letter(+td.dataset.c) + (+td.dataset.r + 2);
  $('val').textContent = r[k] || '';
});
$('sheet').addEventListener('dblclick', e => {
  const td = e.target.closest('td[data-c]'); if (!td) return;
  const v = view[+td.dataset.r][cols[+td.dataset.c][0]]; if (v) copy(v, 'Copied: ' + v.slice(0,40));
});
$('copyRows').addEventListener('click', () => {
  const tsv = [cols.map(c=>c[1]).join('\t'), ...view.map(r => cols.map(([k])=>(r[k]||'').replace(/\t|\n/g,' ')).join('\t'))].join('\n');
  copy(tsv, `Copied ${view.length} rows — paste into Excel or Sheets`);
});
['q','fType','fPri','fState','fHas'].forEach(id => $(id).addEventListener('input', filter));
document.querySelectorAll('.sheettabs button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.sheettabs button').forEach(x=>x.classList.toggle('on', x===b)); tab=b.dataset.s; render();
}));
filter();
</script>
